[package]
name = "backend"
version = "0.1.0"
edition = "2024"
default-run = "backend"

[workspace]
members = [".", "migration"]

[dependencies]
axum = "0.8.8"
chrono = { version = "0.4.43", features = ["serde"] }
dotenvy = "0.15.7"
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-rust_decimal", "with-uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
migration = { path = "migration" }
argon2 = "0.5.3"
rand = "0.9.2"
axum-extra = { version = "0.12.5", features = ["cookie", "multipart"] }
jsonwebtoken = "9.3.0"
uuid = { version = "1.20.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
genpdf = "0.2.0"
printpdf = "0.7.0"
csv = "1.3"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder"] }
