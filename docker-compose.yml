services:
  db:
    image: postgres:16-alpine
    container_name: hotela-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotela123}
      POSTGRES_DB: ${DB_NAME:-hotela_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotela-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-hotela123}@db:5432/${DB_NAME:-hotela_management}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80,http://localhost}
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/usr/local/bin/uploads
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotela-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
